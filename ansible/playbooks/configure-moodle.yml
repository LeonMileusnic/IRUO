---
- name: Configure Moodle application servers
  hosts: moodle
  become: true

  vars:
    data_disk: /dev/vdb
    data_mount_point: /data
    moodle_web_root: /var/www/html/moodle
    moodle_data_dir: /data/moodledata

    moodle_version: MOODLE_401_STABLE
    moodle_db_name: moodle
    moodle_db_user: moodle

    moodle_db_password: "{{ lookup('env', 'MOODLE_DB_PASSWORD') }}"
    moodle_admin_password: "{{ lookup('env', 'MOODLE_ADMIN_PASSWORD') }}"

  pre_tasks:
    - name: Verify Moodle database password is provided
      ansible.builtin.assert:
        that:
          - moodle_db_password | length > 0
        fail_msg: "MOODLE_DB_PASSWORD environment variable is required."

    - name: Verify Moodle admin password is provided
      ansible.builtin.assert:
        that:
          - moodle_admin_password | length > 0
        fail_msg: "MOODLE_ADMIN_PASSWORD environment variable is required."

  tasks:
    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - httpd
          - mariadb-server
          - php
          - php-cli
          - php-common
          - php-mysqlnd
          - php-gd
          - php-xml
          - php-mbstring
          - php-intl
          - php-json
          - php-opcache
          - git
          - curl
          - xfsprogs
          - firewalld
          - python3-PyMySQL
        state: present

    - name: Enable and start Apache
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true

    - name: Enable and start MariaDB
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true

    - name: Enable and start firewalld
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Wait for attached data disk
      ansible.builtin.wait_for:
        path: "{{ data_disk }}"
        timeout: 60

    - name: Check whether data disk already has a filesystem
      ansible.builtin.command:
        cmd: "blkid {{ data_disk }}"
      register: data_disk_blkid
      changed_when: false
      failed_when: false

    - name: Create XFS filesystem on data disk
      community.general.filesystem:
        fstype: xfs
        dev: "{{ data_disk }}"
      when: data_disk_blkid.rc != 0

    - name: Create data mount point
      ansible.builtin.file:
        path: "{{ data_mount_point }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Mount data disk
      ansible.posix.mount:
        path: "{{ data_mount_point }}"
        src: "{{ data_disk }}"
        fstype: xfs
        opts: defaults
        state: mounted

    - name: Create Moodle data directory
      ansible.builtin.file:
        path: "{{ moodle_data_dir }}"
        state: directory
        owner: apache
        group: apache
        mode: "0770"

    - name: Download Moodle source code
      ansible.builtin.git:
        repo: https://github.com/moodle/moodle.git
        dest: "{{ moodle_web_root }}"
        version: "{{ moodle_version }}"
        depth: 1
        force: false

    - name: Set Moodle directory ownership
      ansible.builtin.file:
        path: "{{ moodle_web_root }}"
        owner: apache
        group: apache
        recurse: true

    - name: Create Moodle database
      community.mysql.mysql_db:
        name: "{{ moodle_db_name }}"
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock

    - name: Create Moodle database user
      community.mysql.mysql_user:
        name: "{{ moodle_db_user }}"
        password: "{{ moodle_db_password }}"
        priv: "{{ moodle_db_name }}.*:ALL"
        host: localhost
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock

    - name: Check whether Moodle is already installed
      ansible.builtin.stat:
        path: "{{ moodle_web_root }}/config.php"
      register: moodle_config

    - name: Install Moodle non-interactively
      ansible.builtin.command:
        argv:
          - /usr/bin/php
          - "{{ moodle_web_root }}/admin/cli/install.php"
          - --non-interactive
          - --agree-license
          - --lang=en
          - "--wwwroot=http://{{ ansible_host }}/moodle"
          - "--dataroot={{ moodle_data_dir }}"
          - --dbtype=mariadb
          - --dbhost=localhost
          - "--dbname={{ moodle_db_name }}"
          - "--dbuser={{ moodle_db_user }}"
          - "--dbpass={{ moodle_db_password }}"
          - --fullname=TechSprint Moodle
          - --shortname=TechSprint
          - --adminuser=admin
          - "--adminpass={{ moodle_admin_password }}"
          - --adminemail=admin@example.local
      become_user: apache
      no_log: true
      when: not moodle_config.stat.exists

    - name: Create load balancer health check endpoint
      ansible.builtin.copy:
        dest: /var/www/html/moodle-health.html
        owner: apache
        group: apache
        mode: "0644"
        content: |
          OK

    - name: Allow HTTP through firewalld
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled