---
- name: Prepare shared storage directories
  hosts: moodle
  become: true

  vars:
    shared_directory: /data/shared

  tasks:
    - name: Install NFS packages
      ansible.builtin.dnf:
        name:
          - nfs-utils
        state: present

    - name: Create shared directory
      ansible.builtin.file:
        path: "{{ shared_directory }}"
        state: directory
        owner: apache
        group: apache
        mode: "0770"


- name: Configure primary Moodle nodes as NFS servers
  hosts: moodle_primary
  become: true

  vars:
    shared_directory: /data/shared

  tasks:
    - name: Configure NFS export
      ansible.builtin.lineinfile:
        path: /etc/exports
        line: "{{ shared_directory }} {{ developer_network }}(rw,sync,no_subtree_check,root_squash)"
        create: true
        state: present
      notify:
        - Reload NFS exports

    - name: Enable and start NFS server
      ansible.builtin.service:
        name: nfs-server
        state: started
        enabled: true

    - name: Allow NFS through firewalld
      ansible.posix.firewalld:
        service: nfs
        permanent: true
        immediate: true
        state: enabled

    - name: Allow mountd through firewalld
      ansible.posix.firewalld:
        service: mountd
        permanent: true
        immediate: true
        state: enabled

    - name: Allow rpc-bind through firewalld
      ansible.posix.firewalld:
        service: rpc-bind
        permanent: true
        immediate: true
        state: enabled

  handlers:
    - name: Reload NFS exports
      ansible.builtin.command:
        cmd: exportfs -ra
      changed_when: true


- name: Mount shared storage on secondary Moodle nodes
  hosts: moodle_secondary
  become: true

  vars:
    shared_directory: /data/shared

  tasks:
    - name: Create shared mount directory
      ansible.builtin.file:
        path: "{{ shared_directory }}"
        state: directory
        owner: apache
        group: apache
        mode: "0770"

    - name: Mount shared NFS storage
      ansible.posix.mount:
        path: "{{ shared_directory }}"
        src: "{{ nfs_server_ip }}:{{ shared_directory }}"
        fstype: nfs
        opts: defaults,_netdev
        state: mounted